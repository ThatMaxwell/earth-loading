<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading...</title>
<meta name="description" content="Earth is loading. Random Wikipedia images, forever.">
<link rel="icon" href="earth.gif" type="image/gif">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #fff;
    overflow: hidden;
    font-family: "Times New Roman", Times, serif;
    color: #202122;
  }

  /* ---------- center: wikipedia thumb ---------- */
  #stage {
    position: fixed;
    inset: 0 0 110px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .thumb {
    background: #f8f9fa;
    border: 1px solid #c8ccd1;
    padding: 4px;
    max-width: min(92vw, 640px);
    opacity: 0;
    /* choppy, setInterval-era fade */
    transition: opacity 0.6s steps(6, end);
    font-family: sans-serif;
  }
  .thumb.on { opacity: 1; }
  .thumb img {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 220px);
    border: 1px solid #c8ccd1;
    background: #fff;
  }
  .thumb .cap {
    font-size: 15px;
    line-height: 1.4;
    padding: 6px 4px 3px;
    word-break: break-word;
  }

  /* ---------- bottom right: earth + Loading... ---------- */
  #loading {
    position: fixed;
    right: 22px;
    bottom: 18px;
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }
  #loading img { width: 72px; height: 72px; }
  #loading span {
    font-size: 48px;
    color: #002f6c;
    letter-spacing: 0.5px;
  }
  #loading span::after {
    content: "";
    display: inline-block;
    width: 1.1em;
    text-align: left;
    animation: dots 1.6s steps(1, end) infinite;
  }
  @keyframes dots {
    0%   { content: ""; }
    25%  { content: "."; }
    50%  { content: ".."; }
    75%  { content: "..."; }
  }

  /* ---------- bottom left: logo ---------- */
  #logo {
    position: fixed;
    left: 18px;
    bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #202122;
    opacity: 0.35;
    transition: opacity 0.3s ease;
  }
  #logo svg { width: 30px; height: 30px; flex: none; }
  #logo .msg {
    font-family: sans-serif;
    font-size: 15px;
    white-space: nowrap;
    max-width: 0;
    overflow: hidden;
    opacity: 0;
    transform: translateX(-8px);
    transition: max-width 0.45s ease, opacity 0.35s ease, transform 0.35s ease;
  }
  #logo:hover, #logo:focus-visible { opacity: 0.9; }
  #logo:hover .msg, #logo:focus-visible .msg {
    max-width: 320px;
    opacity: 1;
    transform: none;
  }
  #logo:hover svg, #logo:focus-visible svg {
    animation: cog 1.2s infinite;
  }
  /* snaps 45deg (one petal) at a time, like a ratchet */
  @keyframes cog {
    0%    { transform: rotate(0deg);   animation-timing-function: cubic-bezier(.6,0,.2,1.4); }
    20%   { transform: rotate(45deg); }
    50%   { transform: rotate(45deg);  animation-timing-function: cubic-bezier(.6,0,.2,1.4); }
    70%   { transform: rotate(90deg); }
    100%  { transform: rotate(90deg); }
  }

  /* ---------- top left: music toggle ---------- */
  #music {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 34px;
    height: 34px;
    padding: 6px;
    border: 0;
    background: none;
    cursor: pointer;
    color: #202122;
    opacity: 0.35;
    transition: opacity 0.3s ease;
  }
  #music:hover, #music:focus-visible, #music.playing { opacity: 0.9; }
  #music svg { width: 100%; height: 100%; display: block; }
  #music .off { stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  #music.playing .off { display: none; }
  #music.playing svg { animation: bob 1s steps(2, end) infinite; }
  @keyframes bob { 50% { transform: translateY(-2px); } }

  @media (max-width: 560px) {
    #loading img { width: 48px; height: 48px; }
    #loading span { font-size: 30px; }
    #logo svg { width: 24px; height: 24px; }
    #logo .msg { font-size: 13px; }
    #logo:hover .msg { max-width: 60vw; white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) {
    #logo:hover svg { animation: none; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<button id="music" type="button" aria-label="Play music" aria-pressed="false">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M9 17.5V5l11-2v12.5a2.5 2.5 0 1 1-1.5-2.3V7.1L10.5 8.6v8.9A2.5 2.5 0 1 1 9 15.2z"/>
    <line class="off" x1="3" y1="3" x2="21" y2="21"/>
  </svg>
</button>
<audio id="song" src="song.mp3" loop preload="none"></audio>

<a id="logo" href="https://github.com/ThatMaxwell" target="_blank" rel="noopener" aria-label="Check out ThatMaxwell's other projects!">
  <svg viewBox="225 225 804 804" aria-hidden="true">
    <g fill="#202122">
      <path d="M 627 627 C 585 549, 531 437, 535 333 C 539 241, 592 237, 627 237 C 662 237, 715 241, 719 333 C 723 437, 669 549, 627 627 Z" transform="rotate(0 627 627)"/>
      <path d="M 627 627 C 585 549, 531 437, 535 333 C 539 241, 592 237, 627 237 C 662 237, 715 241, 719 333 C 723 437, 669 549, 627 627 Z" transform="rotate(45 627 627)"/>
      <path d="M 627 627 C 585 549, 531 437, 535 333 C 539 241, 592 237, 627 237 C 662 237, 715 241, 719 333 C 723 437, 669 549, 627 627 Z" transform="rotate(90 627 627)"/>
      <path d="M 627 627 C 585 549, 531 437, 535 333 C 539 241, 592 237, 627 237 C 662 237, 715 241, 719 333 C 723 437, 669 549, 627 627 Z" transform="rotate(135 627 627)"/>
      <path d="M 627 627 C 585 549, 531 437, 535 333 C 539 241, 592 237, 627 237 C 662 237, 715 241, 719 333 C 723 437, 669 549, 627 627 Z" transform="rotate(180 627 627)"/>
      <path d="M 627 627 C 585 549, 531 437, 535 333 C 539 241, 592 237, 627 237 C 662 237, 715 241, 719 333 C 723 437, 669 549, 627 627 Z" transform="rotate(225 627 627)"/>
      <path d="M 627 627 C 585 549, 531 437, 535 333 C 539 241, 592 237, 627 237 C 662 237, 715 241, 719 333 C 723 437, 669 549, 627 627 Z" transform="rotate(270 627 627)"/>
      <path d="M 627 627 C 585 549, 531 437, 535 333 C 539 241, 592 237, 627 237 C 662 237, 715 241, 719 333 C 723 437, 669 549, 627 627 Z" transform="rotate(315 627 627)"/>
    </g>
  </svg>
  <span class="msg">Check out ThatMaxwell's other projects!</span>
</a>

<div id="loading"><img src="earth.gif" alt=""><span>Loading</span></div>

<script>
(function () {
  var API = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*" +
    "&generator=random&grnnamespace=6&grnlimit=20" +
    "&prop=imageinfo&iiprop=url|mime&iiurlwidth=800";
  var SHOW = 2000, GAP = 500, FADE = 600;
  var queue = [];
  var seen = {}; // every file already queued this visit, so nothing repeats
  var stage = document.getElementById("stage");

  function refill() {
    return fetch(API).then(function (r) { return r.json(); }).then(function (d) {
      var pages = (d.query && d.query.pages) || {};
      Object.keys(pages).forEach(function (k) {
        var p = pages[k], ii = p.imageinfo && p.imageinfo[0];
        if (!ii || !/^image\/(jpeg|png|gif|webp)$/.test(ii.mime)) return;
        if (seen[p.title]) return;
        seen[p.title] = true;
        queue.push({
          src: ii.thumburl || ii.url,
          title: p.title.replace(/^File:/, "").replace(/\.[a-z0-9]+$/i, "").replace(/_/g, " ")
        });
      });
    });
  }

  function next() {
    var go = queue.length ? Promise.resolve() : refill();
    return go.then(function () {
      if (!queue.length) throw new Error("empty");
      var item = queue.shift();
      if (queue.length < 5) refill().catch(function () {});
      return new Promise(function (ok, bad) {
        var img = new Image();
        img.onload = function () { ok({ img: img, item: item }); };
        img.onerror = bad;
        img.src = item.src;
      });
    });
  }

  function show(res) {
    var box = document.createElement("div");
    box.className = "thumb";
    var cap = document.createElement("div");
    cap.className = "cap";
    cap.textContent = res.item.title;
    res.img.alt = res.item.title;
    box.appendChild(res.img);
    box.appendChild(cap);
    stage.innerHTML = "";
    stage.appendChild(box);
    box.offsetWidth; // force reflow so the fade-in runs
    box.classList.add("on");
    setTimeout(function () {
      box.classList.remove("on");
      setTimeout(loop, FADE + GAP);
    }, FADE + SHOW);
  }

  function loop() {
    next().then(show, function () { setTimeout(loop, 1500); });
  }

  loop();

  var btn = document.getElementById("music"), song = document.getElementById("song");
  btn.addEventListener("click", function () {
    if (song.paused) song.play(); else song.pause();
  });
  song.addEventListener("play", function () {
    btn.classList.add("playing");
    btn.setAttribute("aria-pressed", "true");
    btn.setAttribute("aria-label", "Pause music");
  });
  song.addEventListener("pause", function () {
    btn.classList.remove("playing");
    btn.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-label", "Play music");
  });
})();
</script>
</body>
</html>
